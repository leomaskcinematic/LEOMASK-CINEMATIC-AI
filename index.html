<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEOMASK CINEMATIC AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #202020 0%, #080808 45%, #000 100%);
      color: white;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 45px 20px 30px;
    }

    .logo {
      text-align: center;
      font-size: 52px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .tagline {
      text-align: center;
      color: #aaa;
      font-size: 15px;
      margin-bottom: 40px;
    }

    .button {
      width: 100%;
      padding: 18px;
      margin: 10px 0;
      border: 1px solid #444;
      border-radius: 14px;
      background: linear-gradient(135deg, #181818, #0d0d0d);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: #888;
      background: #202020;
    }

    .new-project {
      border-color: #777;
      background: linear-gradient(135deg, #292929, #111);
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 12px;
      margin-top: 45px;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">🎭</div>

    <h1>LEOMASK CINEMATIC AI</h1>

    <p class="tagline">
      Turn your stories into cinematic worlds.
    </p>

    <button class="button new-project">
      🎬 NEW PROJECT
    </button>

    <button class="button">
      📂 MY PROJECTS
    </button>

    <button class="button">
      👤 CHARACTERS
    </button>

    <button class="button">
      🎞️ MY SCENES
    </button>

    <button class="button">
      ⚙️ SETTINGS
    </button>

    <p class="footer">
      🖤 Built by LEOMASK
    </p>

  </main>

</body>
  </html>
